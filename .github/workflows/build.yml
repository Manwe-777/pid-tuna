name: Build desktop bundles

# Builds Tauri desktop installers for macOS (universal), Windows, and Linux.
# Called by the CI workflow after semantic-release cuts a version: the
# installers are attached to that version's GitHub release. A manual run builds
# without a release and keeps the bundles as workflow artifacts.
on:
  workflow_call:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:
    permissions:
      # Needed by tauri-action to create / update the release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Linux system dependencies for Tauri 2. We use ubuntu-22.04 because
      # 24.04 dropped libwebkit2gtk-4.x-dev entirely; libxdo and ayatana-
      # appindicator are the official Tauri 2 picks (the older `libappindicator3-dev`
      # conflicts with the ayatana one).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Cache the Rust build artifacts (the slow part of every Tauri build).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The version lives in git tags; stamp it into the files Tauri and Cargo read.
      - name: Set release version
        if: inputs.version != ''
        shell: bash
        run: |
          npm pkg set version=${{ inputs.version }}
          perl -pi -e 'if (!$done && s/^version = ".*"/version = "${{ inputs.version }}"/) { $done = 1 }' src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ inputs.version }}
        with:
          # Attach the installers to the release semantic-release just published.
          tagName: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
          releaseName: ${{ inputs.version != '' && format('PIDTuna v{0}', inputs.version) || '' }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # For manual (workflow_dispatch) runs there's no release to attach assets to,
      # so make the bundles downloadable as workflow artifacts.
      - name: Upload bundles as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pidtuna-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 14
